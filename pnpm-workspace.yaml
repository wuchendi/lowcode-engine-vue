packages:
  - packages/renderer/*
  - packages/plugins/*
  - packages/tools/*
  - packages/materials/*
  - packages/tsconfig
  - apps/*

catalogs:
  dev:
    "@biomejs/biome": ^2.6.7
    "@playwright/test": 1.65.0
    "@types/node": ^26.6.6
    "@vitejs/plugin-react": ^6.3.0
    jsdom: ^31.0.1
    less: ^4.9.1
    sass: ^1.108.2
    tsdown: ^0.23.7
    typescript: ^7.0.2
    unocss: ^66.13.0
    vite: ^8.3.8
    vitest: ^5.1.0
  shared:
    "@alilc/lowcode-designer": ^1.3.4
    "@alilc/lowcode-engine": ^1.3.4
    "@alilc/lowcode-shell": ^1.3.4
    "@alilc/lowcode-types": ^1.3.4
    "@alilc/lowcode-utils": ^1.3.4
    "@types/react": ^16.14.70
    intl-messageformat: ^10.7.18
    react: ^16.14.0
    react-dom: ^19.3.1
  materials:
    "@types/lodash": ^4.17.27
    lodash: ^4.17.21
  plugins:
    "@alifd/next": ^1.27.34
  vue2-7:
    vue: 2.7.16
    vue-router: 3.6.5
  vue3:
    "@vue/test-utils": ^2.4.6
    lodash: ^4.17.21
    uuid: ^9.0.1
    vue: 3.5.45
    vue-router: 4.6.4

peerDependencyRules:
  allowedVersions:
    # @formily/grid (official datasource panel) only uses TypeScript for types
    "@formily/grid>typescript": "7"

allowBuilds:
  "@parcel/watcher": true
  ant-design-vue: true
  core-js: true
  core-js-pure: true
  ejs: true
  esbuild: true
  swiper: true

minimumReleaseAgeExclude:
  - jsdom@31.0.1
  - "@unocss/autocomplete@66.13.0"
  - "@unocss/cli@66.13.0"
  - "@unocss/config@66.13.0"
  - "@unocss/core@66.13.0"
  - "@unocss/extractor-arbitrary-variants@66.13.0"
  - "@unocss/inspector@66.13.0"
  - "@unocss/preset-attributify@66.13.0"
  - "@unocss/preset-icons@66.13.0"
  - "@unocss/preset-mini@66.13.0"
  - "@unocss/preset-tagify@66.13.0"
  - "@unocss/preset-typography@66.13.0"
  - "@unocss/preset-uno@66.13.0"
  - "@unocss/preset-web-fonts@66.13.0"
  - "@unocss/preset-wind3@66.13.0"
  - "@unocss/preset-wind4@66.13.0"
  - "@unocss/preset-wind@66.13.0"
  - "@unocss/rollup@66.13.0"
  - "@unocss/rule-utils@66.13.0"
  - "@unocss/transformer-attributify-jsx@66.13.0"
  - "@unocss/transformer-compile-class@66.13.0"
  - "@unocss/transformer-directives@66.13.0"
  - "@unocss/transformer-variant-group@66.13.0"
  - "@unocss/vite@66.13.0"
  - unocss@66.13.0

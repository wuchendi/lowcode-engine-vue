name: Deploy designer

# Deploys the designer (apps/designer/dist, a static site) to Cloudflare
# Pages. Manual: Actions -> Deploy designer -> Run workflow (pick the branch
# to deploy; main is the production branch).
#
# Setup (repository settings):
# - secret CLOUDFLARE_API_TOKEN: API token with "Account / Cloudflare Pages /
#   Edit"
# - secret CLOUDFLARE_ACCOUNT_ID
# - variable CLOUDFLARE_PAGES_PROJECT (optional, default "lowcode-vue"): the
#   Pages project, created on the first deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-designer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'lowcode-vue' }}
      BRANCH: ${{ github.ref_name }}
    steps:
      # The secrets reach only the steps that need them (not the install
      # scripts of the dependencies)
      - name: Check the Cloudflare settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Also builds the packages (prepare)
      - run: pnpm install --frozen-lockfile

      - name: Build designer
        run: pnpm build:designer

      # Fails when the project exists already: then the deploy goes on
      - name: Create the Pages project if missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm dlx wrangler@4 pages project create "$PROJECT"
          --production-branch main || true

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm dlx wrangler@4 pages deploy apps/designer/dist
          --project-name "$PROJECT"
          --branch "$BRANCH"
          --commit-hash "$GITHUB_SHA"

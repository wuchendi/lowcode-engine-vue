name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Builds every package first, then type-checks them.
      - name: Build and type-check
        run: pnpm lint:type

      - name: Test
        run: pnpm test

      - name: Check the package manifests
        run: pnpm check:publint

      - name: Build designer
        run: pnpm build:designer

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Also builds the packages (prepare)
      - run: pnpm install --frozen-lockfile

      - name: Build designer
        run: pnpm build:designer

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Serves the designer build and checks it in both Vue versions
      - name: E2E
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
